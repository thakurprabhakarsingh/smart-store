<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Clean Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-wrapper" class="auth-card">
    <div class="auth-tabs">
      <button id="tab-login-btn" class="active" onclick="switchAuthTab('login')">Admin Login</button>
      <button id="tab-reg-btn" onclick="switchAuthTab('register')">Register Admin</button>
    </div>

    <div id="login-form">
      <input type="text" id="admin-user" placeholder="Admin Username">
      <input type="password" id="admin-pass" placeholder="Admin Password">
      <button class="primary-btn" onclick="adminLogin()">Login</button>
    </div>

    <div id="reg-form" style="display: none;">
      <input type="text" id="reg-user" placeholder="Choose Username">
      <input type="password" id="reg-pass" placeholder="Choose Password">
      <input type="password" id="reg-secret" placeholder="Admin Secret Key (ADMINSECRET)">
      <button class="primary-btn" onclick="adminRegister()">Register Admin</button>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" style="display: none;">
    <header>
      <h2>⚙️ Admin Control Panel</h2>
      <button class="logout-btn" onclick="adminLogout()">Logout</button>
    </header>

    <!-- Clean Navigation Tabs -->
    <nav class="admin-nav-tabs">
      <button class="nav-tab active" onclick="switchSection('products-sec', this)">📦 Products Inventory</button>
      <button class="nav-tab" onclick="switchSection('orders-sec', this)">🛒 Orders List</button>
      <button class="nav-tab" onclick="switchSection('chat-sec', this)">💬 Support Chat</button>
      <button class="nav-tab" onclick="switchSection('banner-sec', this)">🖼️ Banner & Categories</button>
    </nav>

    <div class="container">
      
      <!-- Section 1: Products -->
      <section id="products-sec" class="admin-section active">
        <div class="card">
          <button class="accordion-toggle" onclick="toggleAccordion('add-prod-collapse')">
            <span>➕ Add New Product (Click to Expand)</span>
            <span id="add-prod-icon">▼</span>
          </button>
          <div id="add-prod-collapse" class="collapsible-content">
            <input type="text" id="prod-name" placeholder="Product Name">
            <input type="number" id="prod-price" placeholder="Price (₹)">
            <select id="prod-category"></select>
            <input type="text" id="prod-image" placeholder="Image URL (https://...)">
            <button class="primary-btn green" onclick="addProduct()">Publish Product</button>
          </div>
        </div>

        <div class="card">
          <div class="section-header-row">
            <h3>📦 All Added Products</h3>
            <input type="text" id="admin-search-input" placeholder="🔍 Search product in inventory..." oninput="filterAdminProducts()">
          </div>
          <div id="admin-products-list"></div>
        </div>
      </section>

      <!-- Section 2: Orders -->
      <section id="orders-sec" class="admin-section">
        <div class="card">
          <h3>🛒 Customer Orders</h3>
          <p style="font-size: 13px; color: #64748b;">Click on any order to view details & status.</p>
          <div id="orders-list"></div>
        </div>
      </section>

      <!-- Section 3: Support Chat -->
      <section id="chat-sec" class="admin-section">
        <div class="card">
          <h3>💬 Customer Support Desk</h3>
          <p style="font-size: 13px; color: #64748b;">Click customer inquiry to open message thread.</p>
          <div id="admin-support-list"></div>
        </div>
      </section>

      <!-- Section 4: Banner & Categories -->
      <section id="banner-sec" class="admin-section">
        <div class="card">
          <h3>🖼️ Offer Banner Settings</h3>
          <input type="text" id="banner-img" placeholder="Banner Image URL">
          <input type="text" id="banner-text" placeholder="Banner Caption/Title">
          <button class="primary-btn" onclick="saveBanner()">Update Banner</button>
        </div>

        <div class="card">
          <h3>🏷️ Store Categories</h3>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="new-category" placeholder="New Category Name">
            <button class="primary-btn" style="width: auto;" onclick="addCategory()">Add Category</button>
          </div>
          <div id="admin-category-chips" class="cat-chips-list"></div>
        </div>
      </section>

    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
