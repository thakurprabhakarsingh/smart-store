<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStore - Online Shopping</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase App & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="nav-brand">
      <h2><i class="fa-solid fa-store"></i> SmartStore</h2>
    </div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search products...">
      <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="nav-actions">
      <button id="auth-btn" class="btn btn-outline"><i class="fa-solid fa-user"></i> <span id="auth-btn-text">Login</span></button>
      <button id="cart-btn" class="btn btn-primary"><i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <!-- Banner Slider -->
  <div class="slider-container" id="banner-slider">
    <div class="slider-wrapper" id="slider-wrapper"></div>
    <button class="slider-btn prev" id="slider-prev"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="slider-btn next" id="slider-next"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <!-- Category Filter Bar -->
  <section class="categories-bar" id="category-chips">
    <button class="chip active" data-category="All">All Items</button>
  </section>

  <!-- Best Deals Carousel -->
  <section class="section-container" id="best-deals-section">
    <div class="section-title">
      <h3>🔥 Today's Best Deals</h3>
    </div>
    <div class="products-grid deals-row" id="best-deals-grid"></div>
  </section>

  <!-- All Products Grid -->
  <section class="section-container">
    <div class="section-title">
      <h3>🛍️ Explore Products</h3>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </section>

  <!-- Firebase Recaptcha Container (Invisible) -->
  <div id="recaptcha-container"></div>

  <!-- Auth Modal -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-auth-modal">&times;</span>
      
      <!-- Step 1: Phone Input -->
      <div id="auth-phone-step">
        <h3>Login / Register</h3>
        <p>Apna 10-digit mobile number enter karein</p>
        <div class="form-group">
          <input type="tel" id="auth-phone" placeholder="Mobile Number (e.g. 9876543210)" maxlength="10">
        </div>
        <button id="send-otp-btn" class="btn btn-primary btn-block">Send OTP</button>
      </div>

      <!-- Step 2: OTP Verification -->
      <div id="auth-otp-step" style="display: none;">
        <h3>Verify OTP</h3>
        <p>Aapke mobile par 6-digit OTP bheja gaya hai</p>
        <div class="form-group">
          <input type="text" id="auth-otp" placeholder="Enter 6-Digit OTP" maxlength="6">
        </div>
        <button id="verify-otp-btn" class="btn btn-success btn-block">Verify OTP</button>
        <button id="back-to-phone-btn" class="btn btn-link btn-block">Number Badlein</button>
      </div>

      <!-- Step 3: Complete Profile (First Time User) -->
      <div id="auth-profile-step" style="display: none;">
        <h3>Complete Profile</h3>
        <p>Delivery details enter karein</p>
        <div class="form-group">
          <input type="text" id="profile-name" placeholder="Full Name">
        </div>
        <div class="form-group">
          <input type="text" id="profile-house" placeholder="House / Flat No.">
        </div>
        <div class="form-group">
          <input type="text" id="profile-city" placeholder="City">
        </div>
        <div class="form-group">
          <textarea id="profile-address" placeholder="Full Street Address" rows="3"></textarea>
        </div>
        <button id="save-profile-btn" class="btn btn-primary btn-block">Save Details & Continue</button>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div class="drawer" id="cart-drawer">
    <div class="drawer-header">
      <h3>Your Cart</h3>
      <span class="close-btn" id="close-cart-drawer">&times;</span>
    </div>
    <div class="drawer-body" id="cart-items">
      <p class="empty-msg">Aapka cart khali hai.</p>
    </div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Total Amount:</span>
        <span id="cart-total-price">₹0</span>
      </div>
      <button id="checkout-btn" class="btn btn-primary btn-block">Place Order (COD)</button>
    </div>
  </div>

  <!-- Floating Customer Support Widget -->
  <div class="support-widget" id="support-widget">
    <div class="support-header" id="toggle-support">
      <span><i class="fa-solid fa-headset"></i> Support Help</span>
      <i class="fa-solid fa-chevron-up" id="support-chevron"></i>
    </div>
    <div class="support-body" id="support-body" style="display: none;">
      <div class="support-messages" id="support-messages"></div>
      <div class="support-input-row">
        <input type="text" id="support-input" placeholder="Type a message...">
        <button id="support-send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
