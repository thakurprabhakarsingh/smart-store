<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Store - Shopping Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">🛒 SmartStore</div>
    <div class="search-bar-wrap">
      <input type="text" id="search-input" placeholder="🔍 Search products..." oninput="handleSearch()">
    </div>
    <div class="header-right" id="user-header-status">
      <button class="nav-btn" onclick="openAuthModal()">Login</button>
    </div>
  </header>

  <!-- Banner -->
  <div class="banner-container">
    <div class="banner-box">
      <img id="offer-banner-img" src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200" alt="Banner">
      <div class="banner-caption" id="offer-banner-title">Welcome to Smart Store</div>
    </div>
  </div>

  <div class="container main-content">
    <h3 class="section-title">Shop by Category</h3>
    <div class="category-chips-bar" id="category-chips"></div>

    <h3 class="section-title" style="margin-top: 25px;">Available Products</h3>
    <div class="grid" id="product-list"></div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="b-tab active" onclick="navigateTab('home', this)">
      <span class="icon">🏠</span>
      <span class="lbl">Home</span>
    </button>
    <button class="b-tab" onclick="navigateTab('cart', this)">
      <span class="icon">🛒 <span class="badge" id="cart-count">0</span></span>
      <span class="lbl">Cart</span>
    </button>
    <button class="b-tab" onclick="navigateTab('orders', this)">
      <span class="icon">📦</span>
      <span class="lbl">Orders</span>
    </button>
    <button class="b-tab" onclick="navigateTab('profile', this)">
      <span class="icon">👤</span>
      <span class="lbl">Profile</span>
    </button>
    <button class="b-tab" onclick="navigateTab('chat', this)">
      <span class="icon">💬</span>
      <span class="lbl">Connect</span>
    </button>
  </nav>

  <!-- Phone OTP Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAuthModal()">&times;</span>
      <h3>📱 Mobile Login</h3>
      <p style="font-size: 13px; color: #64748b;">10-digit mobile number se verify karein</p>

      <div id="phone-step-1">
        <input type="tel" id="auth-phone" maxlength="10" placeholder="Enter 10-digit mobile number">
        <button class="primary-btn" onclick="sendOtp()">Send OTP</button>
      </div>

      <div id="phone-step-2" style="display: none;">
        <input type="text" id="auth-otp" maxlength="6" placeholder="Enter 6-digit OTP">
        <button class="primary-btn" onclick="verifyOtp()">Verify OTP</button>
      </div>
    </div>
  </div>

  <!-- Profile Setup Modal -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeProfileModal()">&times;</span>
      <h3>👤 Customer Profile</h3>
      <p style="font-size: 13px; color: #64748b;">Apna delivery address save karein</p>
      <input type="text" id="prof-name" placeholder="Full Name">
      <input type="text" id="prof-phone" readonly style="background: #f1f5f9;">
      <input type="text" id="prof-house" placeholder="House / Flat / Gali No.">
      <input type="text" id="prof-city" placeholder="City / District">
      <textarea id="prof-address" rows="3" placeholder="Complete Street Address & Landmark"></textarea>
      <button class="primary-btn checkout" onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="document.getElementById('cart-modal').style.display='none'">&times;</span>
      <h3>🛍️ Your Shopping Cart</h3>
      <div id="cart-items"></div>
      <div style="font-weight: bold; font-size: 17px; margin: 15px 0;">Total: ₹<span id="cart-total">0</span></div>
      <button class="primary-btn checkout" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Orders Modal -->
  <div id="orders-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="document.getElementById('orders-modal').style.display='none'">&times;</span>
      <h3>📦 My Orders</h3>
      <div id="my-orders-list"></div>
    </div>
  </div>

  <!-- Connect / Support Modal -->
  <div id="chat-modal" class="modal">
    <div class="modal-content" style="height: 480px; display: flex; flex-direction: column;">
      <span class="close" onclick="document.getElementById('chat-modal').style.display='none'">&times;</span>
      <h3>💬 Customer Support</h3>
      <div class="chat-messages" id="chat-messages" style="flex: 1; overflow-y: auto; background: #f8fafc; padding: 10px; border-radius: 8px;"></div>
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <input type="text" id="chat-input" placeholder="Type query...">
        <button class="primary-btn" style="width: auto;" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
